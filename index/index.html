<script type="text/javascript">
    (function () {
        var w = window,
                d = document,
                protocol = /https/i.test(w.location.protocol) ? 'https:' : 'http:',
                aml = typeof admixerML !== 'undefined' ? admixerML : {};
        aml.fn = aml.fn || [];
        aml.invPath = aml.invPath || (protocol + '//inv-nets.admixer.net/');
        aml.cdnPath = aml.cdnPath || (protocol + '//cdn.admixer.net/');
        if (!w.admixerML) {
            var lodash = document.createElement('script');
            lodash.id = 'amlScript';
            lodash.async = true;
            lodash.type = 'text/javascript';
            lodash.src = aml.cdnPath + 'scripts3/loader2.js';
            var node = d.getElementsByTagName('script')[0];
            node.parentNode.insertBefore(lodash, node);
            w.admixerML = aml;
        }
    })();
</script>
<script type="text/javascript">
    var zones = window.zones || {};
    var json = {
        "seatbid": [{
            "seat": "{{phId}}",
            "bid": [{
                "adid": "{{adId}}",
                "impid": "requestId",
                "advertid": "advertId",
                "camid": 16339,

                "ext": {

                    },
                    "Settings": "{\"OId\":\"{{adId}}\",\"TemplateId\":52,\"tempType\":52,\"Events\":[{\"Name\":\"click\",\"Urls\":[]},{\"Name\":\"view\",\"Urls\":[]},{\"Name\":\"confirmview\",\"Urls\":[]}],\"Items\":[{\"Name\":\"body\",\"Ext\":\".zip\",\"ItemId\":1,\"Types\":[\".zip\"],\"Params\":[{\"Name\":\"libVersion\",\"Value\":2},{\"Name\":\"width\",\"Value\":\"580\"},{\"Name\":\"height\",\"Value\":\"333\"},{\"Name\":\"parametr\",\"Value\":\"0\"}],\"IsVideo\":false}]}",
                    "FrameTemplate": "",
                    "Murl": location.protocol + '//' + location.hostname + ':' + location.port + location.pathname.replace(/[^/.]+\.[^/.]+/,'') + "banners/",
                    "clickprice": 0.0,
                    "utm_tags": null,
                    "zoneid": "zoneId",
                    "ExternalVASTUrl": null,
                    "adGuid": "{{adId}}",
                    "baseTempId": 0,
                    "creativeTempId": 52,
                    "countByConfView": false,
                    "vaPerc": null,
                    "vaMs": null,
                    "IsEmpty": false,
                    "bannerWeight": 1,
                    "siteOId": "siteOid"
                }
            }]
        }],
        "ext": {
            "hiddenBanners": "0",
            "CountryCode": "UA/12",
            "cLat": 50.4333,
            "cLon": 30.5167,
            "AdmVisGuid": "admVisGuid",
            "zones": {
                "{{phId}}": {
                    "zone": "zoneId",
                    "battr": 0,
                    "cbcf": false,
                    "PluginTrackers": []
                }
            }
        }
    };
    var jsonString = JSON.stringify(json);
    window.amResp = window.amResp || [];
    var str, js,keys = Object.keys(zones);
    for (var i = 0, ln = keys.length; i < ln; i++) {
        str = jsonString.replace(/{{(phId|adId)}}/mg, function (res) {
            switch (res) {
                case "{{adId}}" :
                    return zones[keys[i]];
                    break;
                case "{{phId}}" :
                    return keys[i];
                    break;
            }
        });
        js = JSON.parse(str);
        admixerML.fn.push(function(){
			admixerML.proceedSPResponse(js);
			admixerML.display(js.seatbid[0].seat);
		})
    }
//    window.amResp.push(json);
</script>
